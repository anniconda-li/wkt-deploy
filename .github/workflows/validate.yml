name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

      - name: Validate direct-IP deployment contract
        run: |
          docker compose --env-file .env.example -f compose.yaml config --format json > /tmp/compose.json
          python - <<'PY'
          import json

          with open("/tmp/compose.json", encoding="utf-8") as stream:
              config = json.load(stream)

          expected = {
              "ai": ("ghcr.io/anniconda-li/wkt-ai-server:0.3.0", 18080, 8000),
              "intercom": ("ghcr.io/anniconda-li/wkt-intercom-server:0.1.0", 18081, 18081),
              "ota": ("ghcr.io/anniconda-li/wkt-ota-server:1.0.0", 18082, 8000),
          }
          services = config["services"]
          assert set(services) == set(expected)
          for name, (image, published, target) in expected.items():
              service = services[name]
              assert service["image"] == image
              assert service["restart"] == "unless-stopped"
              assert "depends_on" not in service
              assert len(service["ports"]) == 1
              port = service["ports"][0]
              assert port["host_ip"] == "0.0.0.0"
              assert port["protocol"] == "tcp"
              assert port["published"] == str(published)
              assert port["target"] == target

          ota_environment = services["ota"]["environment"]
          assert ota_environment["OTA_PUBLIC_BASE_URL"] == "http://139.129.17.67:18082"
          assert not ({"OTA_DEVICE_TOKEN", "OTA_ALLOW_TOKEN_QUERY", "OTA_MAX_CHUNK_SIZE"} & set(ota_environment))
          assert all(":latest" not in service["image"] for service in services.values())
          PY

      - name: Validate local-build Compose merge
        run: docker compose --env-file .env.example -f compose.yaml -f compose.build.yaml config --quiet

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Run ShellCheck
        run: docker run --rm -v "$PWD:/work:ro" -w /work koalaman/shellcheck-alpine:v0.10.0 shellcheck scripts/*.sh

      - name: Reject tracked secrets and runtime data
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(\.env|.*\.(pem|key|p12|pfx|db|sqlite|sqlite3))$' || true)"
          test -z "$(git ls-files | grep -E '(^|/)(data|backups|firmware|uploads|outputs)/' || true)"
          if git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,})' -- ':!*.example'; then
            echo 'Potential secret found in tracked files' >&2
            exit 1
          fi
